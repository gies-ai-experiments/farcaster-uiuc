name: Deploy Farcaster Snapchain

on:
  push:
    branches:
      - farcaster

# Note: Using PAT instead of GITHUB_TOKEN because:
# 1. This is an external repository (gies-ai-experiments/farcaster-uiuc)
# 2. PAT provides explicit control over repository access
# 3. PAT can be revoked or rotated if needed
# 4. PAT can be scoped to specific repositories
permissions:
  contents: read

jobs:
  deploy:
    name: Deploy to VM
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Debug repository info
        run: |
          echo "Repository: ${{ github.repository }}"
          echo "Ref: ${{ github.ref }}"
          echo "Ref name: ${{ github.ref_name }}"
          echo "SHA: ${{ github.sha }}"

      - name: Deploy to VM via SSH
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.VM_HOST }}
          username: ${{ secrets.VM_USERNAME }}
          key: ${{ secrets.VM_SSH_KEY }}
          port: 22
          timeout: 600s
          script: |
            # Define variables for paths and names on the VM
            PROJECT_DIR="/opt/farcaster-snapchain"
            DATA_DIR="/mnt/point"
            
            echo "--- Debug Information ---"
            echo "Current user: $(whoami)"
            echo "User ID: $(id)"
            echo "Current working directory: $(pwd)"
            echo "Available disk space:"
            df -h

            echo "--- Checking for Docker installation ---"
            if ! command -v docker &> /dev/null
            then
                echo "Docker could not be found on the VM. Please install Docker and try again."
                exit 1
            fi
            if ! docker ps &> /dev/null
            then
                echo "Docker daemon is not running or user cannot access it. Please check Docker setup on the VM."
                exit 1
            fi
            echo "Docker is available and running."

            echo "--- Checking for Docker Compose ---"
            if ! docker compose version &> /dev/null
            then
                echo "Docker Compose could not be found on the VM. Please install Docker Compose and try again."
                exit 1
            fi
            echo "Docker Compose is available."

            echo "--- Creating necessary directories ---"
            echo "Creating PROJECT_DIR: $PROJECT_DIR"
            sudo mkdir -p "$PROJECT_DIR" || { echo "Failed to create PROJECT_DIR"; exit 1; }
            
            echo "Creating DATA_DIR: $DATA_DIR"
            sudo mkdir -p "$DATA_DIR" || { echo "Failed to create DATA_DIR"; exit 1; }
            
            echo "Setting ownership for PROJECT_DIR"
            sudo chown -R $USER:$USER "$PROJECT_DIR" || { echo "Failed to set ownership for PROJECT_DIR"; exit 1; }
            
            echo "Setting ownership for DATA_DIR"
            sudo chown -R $USER:$USER "$DATA_DIR" || { echo "Failed to set ownership for DATA_DIR"; exit 1; }
            
            echo "Navigating to project directory"
            cd "$PROJECT_DIR" || { echo "Failed to navigate to project directory. Exiting."; exit 1; }
            
            echo "Current directory: $(pwd)"
            echo "Directory permissions:"
            ls -la "$PROJECT_DIR"
            ls -la "$DATA_DIR"

            echo "--- Cleaning up directory ---"
            rm -rf ./* ./.* 2>/dev/null || true

            echo "--- Initializing Git repo ---"
            git clone "https://github.com/${{ github.repository }}.git" .

            # Get the branch name from GitHub context
            CURRENT_BRANCH="${{ github.ref_name }}"
            echo "--- Preparing to deploy branch: $CURRENT_BRANCH ---"

            # Fetch all updates from the remote origin
            echo "Fetching all remote branches and tags..."
            git fetch origin --prune

            # Ensure the target branch exists locally and is up-to-date
            echo "Checking out branch $CURRENT_BRANCH..."
            git checkout "$CURRENT_BRANCH"
            
            echo "Resetting $CURRENT_BRANCH to origin/$CURRENT_BRANCH..."
            git reset --hard "origin/$CURRENT_BRANCH"

            echo "--- Creating/Updating .env file on VM ---"
            {
              echo "DB_NAME=${{ secrets.DB_NAME }}"
              echo "DB_USER=${{ secrets.DB_USER }}"
              echo "DB_PASSWORD=${{ secrets.DB_PASSWORD }}"
              echo "WEB_HOST_URL=${{ secrets.WEB_HOST_URL }}"
              echo "REDASH_SECRET_KEY=${{ secrets.REDASH_SECRET_KEY }}"
              echo "REDASH_COOKIE_SECRET=${{ secrets.REDASH_COOKIE_SECRET }}"
              echo "LOG_LEVEL=info"
              echo "HUB_HOST=snapchain:3381"
              echo "HUB_SSL=false"
              echo "POSTGRES_URL=postgresql://${{ secrets.DB_USER }}:${{ secrets.DB_PASSWORD }}@postgres:5432/${{ secrets.DB_NAME }}"
              echo "REDIS_URL=redis://redis:6379"
              echo "STATSD_HOST=statsd:8125"
              echo "COLORIZE=true"
              echo "WEB_UI_PORT=9000"
              echo "CONCURRENCY=4"
              echo "PARTITIONS=1"
              echo "MAX_FID=100"
              echo "BACKFILL_FIDS="
            } > .env

            echo "--- Ensuring data directory exists ---"
            sudo mkdir -p "$DATA_DIR"
            sudo chown -R $USER:$USER "$DATA_DIR"

            echo "--- Creating Caddyfile ---"
            cat > "$DATA_DIR/Caddyfile" << 'EOF'
            {
                admin off
            }

            # Main domain routes (if WEB_HOST_URL is set)
            {$WEB_HOST_URL} {
                route /redash/* {
                    uri strip_prefix /redash
                    reverse_proxy redash:5000
                }
                route /api/* {
                    reverse_proxy snap_read:3381
                }
                reverse_proxy snap_read:3381
            }

            # Direct port access for development/testing
            :80 {
                route /redash/* {
                    uri strip_prefix /redash
                    reverse_proxy redash:5000
                }
                reverse_proxy snap_read:3381
            }

            :5000 {
                reverse_proxy redash:5000
            }

            :3381 {
                reverse_proxy snap_read:3381
            }

            :3383 {
                reverse_proxy snap_read:3383
            }
            EOF

            echo "--- Verifying docker-compose.yml exists ---"
            if [ ! -f docker-compose.yml ]; then
                echo "docker-compose.yml not found in $PROJECT_DIR! Listing files:"
                ls -la
                exit 1
            fi
            echo "Required files found."

            echo "--- Stopping existing containers ---"
            docker compose down || true

            echo "--- Building and starting new containers ---"
            docker compose up -d --build

            echo "--- Verifying container startup ---"
            sleep 60 # Wait for containers to initialize (increased for shuttle build time)

            # Check if the main services are running
            SERVICES=("snap_read" "postgres" "redis" "shuttle" "redash" "caddy")
            for service in "${SERVICES[@]}"; do
                if docker ps --filter "name=${service}" --filter "status=running" --format "{{.Names}}" | grep -q "${service}"; then
                    echo "${service} container is running."
                else
                    echo "Error: ${service} container did not start correctly."
                    echo "Recent logs for ${service} container:"
                    docker compose logs --tail 50 ${service}
                    exit 1
                fi
            done

            echo "--- Deployment completed successfully! ---" 